name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # A fork and a Dependabot branch both run with no repository secrets, so
      # the Cite step cannot authenticate. Report the reason instead of failing
      # on every outside contribution or dependency bump.
      - name: Report a pull request without secrets
        if: github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'
        run: "echo '::notice::Cite is skipped: a fork or Dependabot pull request receives no repository secrets.'"
      - name: Review this pull request with Cite
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        # Pinned to a full commit SHA, like everything else a repository
        # ruleset checks -- including the actions a composite action calls.
        uses: elecnix/cite@f5707676437aacf2d3566d0e831c5c558717f994 # v0.15.0
        with:
          model_api_key: ${{ secrets.REVIEW_MODEL_API_KEY }}
          model_base_url: ${{ secrets.REVIEW_MODEL_BASE_URL }}
          model_id: ${{ vars.REVIEW_MODEL_ID }}
          structured_output: tools

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: elecnix/vale-action@a8c2225c38f990ea957c63c6aabc505dd49e6ab5 # v1.1.1
        with:
          sync: true
